# Netlify configuration file for Atelier Medical
[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) redirect rule
# Ensures client-side routing and deep links resolve to index.html without 404s
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-control for static assets (images, videos, fonts, CSS, JS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
